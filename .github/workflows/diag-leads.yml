name: Diagnose leads (temporary)

# ВРЕМЕННЫЙ диагностический прогон. Ничего не деплоит и не меняет.
# Нужен, потому что из песочницы агента нет выхода в интернет, кроме GitHub:
# живой воркер и Telegram оттуда не проверить.
#
# Что делает:
#   1) читает /health живого воркера;
#   2) отправляет ОДНУ тестовую заявку (вымышленные данные, «ТЕСТ — можно удалить»)
#      ровно так, как её отправляет браузер с kadry-pro.ru (Origin + preflight);
#   3) печатает код ответа и какие каналы подтвердились;
#   4) проверяет, видит ли бот свой chat_id (getChat), не отправляя сообщений.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: |
          set -e
          URL="https://kadry-leads.ats439.workers.dev"
          echo "=== /health ==="
          curl -sS "$URL/health" | head -c 2000
          echo

      - name: Preflight (как браузер)
        run: |
          URL="https://kadry-leads.ats439.workers.dev"
          echo "=== OPTIONS /leads с Origin kadry-pro.ru ==="
          curl -sS -i -X OPTIONS "$URL/leads" \
            -H 'Origin: https://kadry-pro.ru' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' | head -20

      - name: Test lead (fictitious data)
        run: |
          set -e
          URL="https://kadry-leads.ats439.workers.dev"
          python3 - "$URL" <<'PY'
          import json, sys, time, uuid, urllib.request
          url = sys.argv[1] + "/leads"
          body = {
              "kind": "consult",
              "name": "ТЕСТ — можно удалить",
              "phone": "79990000000",
              "contact_method": "call",
              "consent": True,
              "consent_version": "2026-11-21",
              "page": "index",
              "idempotency_key": str(uuid.uuid4()),
              "honeypot": "",
              "form_started_at": int(time.time() * 1000) - 15000,
              "message": "ТЕСТ — можно удалить. Проверка доставки, отвечать не нужно.",
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode(),
              headers={"content-type": "application/json", "origin": "https://kadry-pro.ru"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as r:
                  code, raw = r.status, r.read().decode()
          except urllib.error.HTTPError as e:
              code, raw = e.code, e.read().decode()
          print("=== POST /leads ===")
          print("HTTP", code)
          print(raw)
          print("--- разбор ---")
          d = json.loads(raw)
          if "error" in d:
              e = d["error"]
              print("ОШИБКА:", e.get("code"), "/", e.get("message"))
              print("Поля:", e.get("fields"))
          else:
              print("ticket:", d.get("ticket"))
              print("delivered:", d.get("delivered"))
              print("channels:", d.get("channels"))
              print("flagged:", d.get("flagged"))
          PY

      - name: Bot can see the chat
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Нет BOT_TOKEN или TELEGRAM_CHAT_ID в секретах GitHub"
            exit 0
          fi
          echo "=== getMe (какой это бот) ==="
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/getMe" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);print("ok:",d.get("ok"),"| username:",(d.get("result") or {}).get("username"),"| error:",d.get("description"))'
          echo "=== getChat (видит ли бот этот chat_id) ==="
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/getChat?chat_id=$TELEGRAM_CHAT_ID" \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);r=d.get("result") or {};print("ok:",d.get("ok"),"| title:",r.get("title"),"| type:",r.get("type"),"| id:",r.get("id"),"| error:",d.get("description"))'
